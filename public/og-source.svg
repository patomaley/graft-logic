<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1e6d3"/>
      <stop offset="52%" stop-color="#e8dcc6"/>
      <stop offset="100%" stop-color="#e2d4ba"/>
    </linearGradient>
    <linearGradient id="vein" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c47a4a" stop-opacity="0"/>
      <stop offset="18%" stop-color="#c47a4a"/>
      <stop offset="52%" stop-color="#d4a574"/>
      <stop offset="82%" stop-color="#c47a4a"/>
      <stop offset="100%" stop-color="#c47a4a" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#paper)"/>
  <!-- soft ambient washes -->
  <ellipse cx="160" cy="-40" rx="420" ry="260" fill="#c4945a" opacity="0.28"/>
  <ellipse cx="1100" cy="680" rx="380" ry="240" fill="#8b5a32" opacity="0.16"/>
  <!-- quiet diagonal kintsugi tear -->
  <path d="M-40 420 C220 300, 420 240, 620 200 C820 160, 980 90, 1240 -20"
        stroke="#c47a4a" stroke-width="1.25" opacity="0.35" fill="none"/>
  <path d="M-20 440 C240 320, 440 255, 640 215 C840 175, 1000 105, 1260 -5"
        stroke="#d4a574" stroke-width="2.2" opacity="0.55" fill="none" filter="url(#glow)"/>
  <!-- brand lockup -->
  <g transform="translate(96, 250)">
    <rect x="0" y="8" width="48" height="48" rx="12" fill="#14100c"/>
    <path d="M10 42 C17 35, 19 28, 22 22 C24 17, 27 15, 32 14"
          stroke="#d4a574" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M22 22 C26 25, 31 31, 38 35"
          stroke="#c47a4a" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <circle cx="22" cy="22" r="1.8" fill="#d4a574"/>
    <text x="68" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="500" fill="#120e0a" letter-spacing="1.5">Kintsugi AI</text>
  </g>
  <rect x="96" y="330" width="160" height="2" fill="url(#vein)" opacity="0.9"/>
  <text x="96" y="390" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#5a4f43" letter-spacing="0.5">See how AI can transform your business.</text>
</svg>
